<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VelaVoyages | Pathless Path</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 20h18L12 4z"/>
                <path d="M12 4l3 8h-6z"/>
            </svg>
            <div class="divider"></div>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
            </svg>
        </div>
        <ul class="nav-links">
            <li><a href="#explore">Explore</a></li>
            <li><a href="#destinations">Destinations</a></li>
            <li><a href="#how-it-works">How it Works</a></li>
            <li><a href="#login" class="nav-login">Log In</a></li>
            <li><a href="#signup" class="nav-signup">Sign Up</a></li>
        </ul>
    </nav>

    <header class="hero" id="home">
        <div class="video-container" id="video-container">
            <video autoplay muted loop playsinline class="bg-video">
                <source src="media/banner.mp4" type="video/mp4">
            </video>
            <div class="video-overlay"></div>
        </div>
        
        <div class="hero-content">
            <div class="hero-left">
                <h1 class="title">DISCOVER YOUR<br>PATHLESS PATH.</h1>
                <p class="slogan">Find unique, hidden gems worldwide with<br>precision and peace.</p>
            </div>
            <div class="hero-right">
                <div class="search-box">
                    <input type="text" placeholder='Search by vibe, terrain, or activity... (e.g., "Remote Alpine Silence")'>
                    <button class="search-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="scroll-icon">
            <div class="mouse">
                <div class="wheel"></div>
            </div>
        </div>
    </header>

    <section id="destinations" class="destinations-section">
        <div class="section-container">
            <h2 class="section-title">Popular Destinations</h2>
            
            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="filter-season">Season</label>
                    <select id="filter-season" class="filter-select">
                        <option value="all">All Seasons</option>
                        <option value="spring">Spring</option>
                        <option value="summer">Summer</option>
                        <option value="autumn">Autumn</option>
                        <option value="winter">Winter</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="filter-country">Country</label>
                    <select id="filter-country" class="filter-select">
                        <option value="all">All Countries</option>
                        <option value="france">France</option>
                        <option value="italy">Italy</option>
                        <option value="spain">Spain</option>
                        <option value="switzerland">Switzerland</option>
                        <option value="netherlands">Netherlands</option>
                        <option value="austria">Austria</option>
                        <option value="greece">Greece</option>
                        <option value="croatia">Croatia</option>
                        <option value="iceland">Iceland</option>
                        <option value="czech republic">Czech Republic</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-category">Category</label>
                    <select id="filter-category" class="filter-select">
                        <option value="all">All Categories</option>
                        <option value="historic">Historic</option>
                        <option value="adventure">Adventure</option>
                        <option value="nature">Nature</option>
                        <option value="beach">Beach</option>
                        <option value="cultural">Cultural</option>
                        <option value="festival">Festival</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-activity">Activity</label>
                    <select id="filter-activity" class="filter-select">
                        <option value="all">All Activities</option>
                        <option value="hiking">Hiking</option>
                        <option value="skiing">Skiing</option>
                        <option value="sightseeing">Sightseeing</option>
                        <option value="island travel">Island Travel</option>
                        <option value="city exploration">City Exploration</option>
                    </select>
                </div>

                <div class="filter-group reset-group">
                    <button id="reset-filters" class="reset-btn">Reset Filters</button>
                </div>
            </div>

            <!-- Dynamic Destinations Grid -->
            <div class="destinations-grid" id="destinations-grid">
                <!-- Data will be populated by script.js -->
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
